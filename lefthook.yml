pre-commit:
  parallel: true
  commands:
    check:
      run: bun run check

pre-push:
  parallel: true
  commands:
    typecheck:
      run: bun run typecheck
    vitest:
      run: bun run test
    cargo-test:
      env:
        PATH: $HOME/.cargo/bin:$PATH
      run: cargo test --manifest-path src-tauri/Cargo.toml
